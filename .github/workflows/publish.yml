name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: 17
      - name: Drop open repositories
        env:
          SONATYPE_USER_NAME: ${{ secrets.SONATYPE_USER_NAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_AUTH_BASE64: ${{ secrets.SONATYPE_AUTH_BASE64 }}
        run: ./gradlew dropOpenSonatypeRepositories
      - name: Publish
        env:
          SONATYPE_USER_NAME: ${{ secrets.SONATYPE_USER_NAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publish
      - name: Close staging repository
        env:
          SONATYPE_USER_NAME: ${{ secrets.SONATYPE_USER_NAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_AUTH_BASE64: ${{ secrets.SONATYPE_AUTH_BASE64 }}
        run: |
          for attempt in 1 2 3; do
            ./gradlew closeSonatypeRepositories && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed, retrying in 5 minutes..."
              sleep 300
            fi
          done
          exit 1
      - name: Check publication
        env:
          SONATYPE_AUTH_BASE64: ${{ secrets.SONATYPE_AUTH_BASE64 }}
        run: ./gradlew kotlinUpgradeYarnLock :tools:check-publication:build -Pcheck_publication
